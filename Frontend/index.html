<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>WhyLong — Free URL Shortener & QR Code Generator</title>

  <meta name="description"
    content="Shorten URLs, create QR codes, and manage your links with WhyLong. Create and share links for free with a simple, fast link management experience." />

  <meta name="author" content="WhyLong" />
  <meta name="robots" content="index, follow" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://whylong.vercel.app/" />

  <!-- Theme -->
  <meta name="theme-color" content="#000000" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Keep this only if the file exists and is a suitable Apple touch icon -->
  <!-- <link rel="apple-touch-icon" href="/apple-touch-icon.png" /> -->

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="WhyLong" />
  <meta property="og:title" content="WhyLong — Free URL Shortener & QR Code Generator" />
  <meta property="og:description"
    content="Shorten URLs, generate QR codes, and manage your links with WhyLong. Create and share links for free." />
  <meta property="og:url" content="https://whylong.vercel.app/" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image" content="https://whylong.vercel.app/og-image.png" />
  <meta property="og:image:alt" content="WhyLong — Free URL Shortener and QR Code Generator" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WhyLong — Free URL Shortener & QR Code Generator" />
  <meta name="twitter:description"
    content="Shorten URLs, generate QR codes, and manage your links with WhyLong for free." />
  <meta name="twitter:image" content="https://whylong.vercel.app/og-image.png" />
  <meta name="twitter:image:alt" content="WhyLong — Free URL Shortener and QR Code Generator" />

  <!-- Global Styles -->
  <style>
    :root {
      font-family: "Poppins", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }
  </style>

  <!-- App -->
  <script type="module" src="/src/main.jsx"></script>
</head>

<body>
  <noscript>
    WhyLong requires JavaScript to be enabled to work properly.
  </noscript>

  <div id="root"></div>
</body>

</html>
